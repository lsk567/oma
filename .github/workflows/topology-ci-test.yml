name: Topology Release Gate

# Run on demand, from the Actions tab. It drives every registered program with
# live agents, so it is slow, paid, and only as reliable as the models behind
# it — worth running deliberately, and no longer worth blocking a release on.
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      OPENAI_API_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: true

concurrency:
  group: topology-release-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  topology-ci-test:
    name: Topology CI Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CODEX_HOME: /tmp/codex-home
      OMAR_TEST_PEEK_AGENTS: "1"
      OMAR_TEST_RESULTS_DIR: /tmp/topology-tests

    steps:
      - name: Check out trusted source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lang
          auto-config: false
          build: false
          test: false

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-topology-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-topology-cargo-
            ${{ runner.os }}-cargo-

      - name: Install Codex and Claude CLIs
        env:
          CODEX_NON_INTERACTIVE: "1"
          DISABLE_AUTOUPDATER: "1"
        run: |
          mkdir -p "$CODEX_HOME"
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          npm install --global @anthropic-ai/claude-code

      - name: Configure agent CLIs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          printf '%s' "$OPENAI_API_KEY" | "$HOME/.local/bin/codex" login --with-api-key
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          workspace = json.dumps(os.environ["GITHUB_WORKSPACE"])
          config = f'[projects.{workspace}]\ntrust_level = "trusted"\n'
          Path(os.environ["CODEX_HOME"], "config.toml").write_text(config)

          claude_state_path = Path.home() / ".claude.json"
          claude_state = {
              "hasCompletedOnboarding": True,
              "bypassPermissionsModeAccepted": True,
              "projects": {
                  os.environ["GITHUB_WORKSPACE"]: {
                      "hasTrustDialogAccepted": True,
                      "projectOnboardingSeenCount": 1,
                  }
              },
          }
          claude_state_path.write_text(json.dumps(claude_state))
          claude_state_path.chmod(0o600)

          claude_config_dir = Path.home() / ".claude"
          claude_config_dir.mkdir(mode=0o700, exist_ok=True)
          claude_settings_path = claude_config_dir / "settings.json"
          claude_settings_path.write_text(
              json.dumps(
                  {"apiKeyHelper": "printenv OMAR_ANTHROPIC_API_KEY"},
                  indent=2,
              )
              + "\n"
          )
          claude_settings_path.chmod(0o600)
          PY

      - name: Verify live agent CLIs
        run: |
          codex --version
          claude --version

      - name: Run live topology suite
        env:
          OMAR_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
          DISABLE_LOGIN_COMMAND: "1"
        run: |
          test -n "$OMAR_ANTHROPIC_API_KEY"
          ./tests/topology/run_local.sh

      - name: Upload topology metrics and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topology-ci-test-${{ github.run_id }}
          path: /tmp/topology-tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove live credentials
        if: always()
        run: |
          rm -rf "$CODEX_HOME"
          tmux kill-server 2>/dev/null || true
