name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run cargo check
        run: cargo check --all-targets

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: .github/scripts/install-packages.sh tmux

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run all tests
        run: cargo test -- --test-threads=1

  omar-language:
    name: OMAR Language
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Lean and test compiler
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lang
          build: true
          test: true

      - name: Compile topology corpus to bytecode (offline)
        working-directory: lang
        run: |
          mkdir -p /tmp/omar-topology-suite
          for source in ../tests/topology/src/*.omar; do
            name=$(basename "$source" .omar)
            lake exe omarc "$source" "/tmp/omar-topology-suite/$name.json"
          done

      - name: Verify top-level OMAR source execution
        env:
          OMARC_BIN: ${{ github.workspace }}/lang/.lake/build/bin/omarc
        run: |
          output=$(cargo run --quiet --bin omar -- run \
            tests/ci/direct_run.omar --input run.request=hello --replace)
          echo "$output"
          grep -Fq 'Output run.result = "hello"' <<<"$output"

      - name: Check bytecode layout and declared agent backends
        run: |
          python3 - <<'PY'
          import glob
          import json
          import os
          import re

          # `[name : Backend, other : Backend]` on a team. A port's type is
          # lowercase (`inp : string`), so naming the backends keeps ports out.
          BACKENDS = "ClaudeCode|Claude|Codex|Cursor|OpenCode|Agy|Stub|Web"
          declaration = re.compile(rf"\b(\w+)\s*:\s*({BACKENDS})\b")

          def declared_backends(name):
              """Agent name -> the backends its source gives it.

              A set: two teams may reuse a local agent name, and instantiating
              qualifies it by a path the source itself never spells.
              """
              with open(f"tests/topology/src/{name}.omar", encoding="utf-8") as source:
                  text = source.read()
              declared = {}
              for agent, backend in declaration.findall(text):
                  declared.setdefault(agent, set()).add(backend)
              return declared

          field_rank = {
              "op": 0, "instance": 1, "kind": 2, "name": 3, "type": 4,
              "delay": 5, "backend": 6, "team": 7
          }
          reaction_order = [
              "op", "instance", "id", "agent", "triggers", "effects",
              "contract", "prompt"
          ]
          connection_order = ["op", "source", "target"]
          bytecodes = glob.glob("/tmp/omar-topology-suite/*.json")
          assert bytecodes, "topology compiler produced no bytecode"
          for path in bytecodes:
              with open(path) as file:
                  bytecode = json.load(file)
              declared = declared_backends(os.path.basename(path)[: -len(".json")])
              assert declared, (path, "source declares no agent")
              for instruction in bytecode["instructions"]:
                  keys = list(instruction)
                  assert keys[0] == "op", (path, keys)
                  ranked = [field_rank[key] for key in keys if key in field_rank]
                  assert ranked == sorted(ranked), (path, keys)
                  if instruction["op"] == "define_port":
                      assert keys in (
                          ["op", "instance", "kind", "name", "type"],
                          ["op", "instance", "kind", "name", "type", "delay"],
                      ), (path, keys)
                  if instruction["op"] == "declare_instance":
                      assert keys == ["op", "name", "parent", "team"], (path, keys)
                  if instruction["op"] == "declare_timer":
                      assert keys == ["op", "instance", "name", "offset", "period"], (path, keys)
                  # Every member names the container it belongs to, so a client
                  # never has to infer the grouping from a dotted name.
                  if instruction["op"] in ("spawn_agent", "define_port", "install_reaction"):
                      assert instruction["instance"], (path, instruction)
                  if instruction["op"] == "connect_ports":
                      # `after` is what buys a delay. A plain connection has
                      # none and says so by leaving the field out.
                      assert keys in (
                          connection_order, connection_order + ["delay"]
                      ), (path, keys)
                  if instruction["op"] == "install_reaction":
                      # `within` is a deadline the reaction set for itself, and
                      # is absent when it set none.
                      assert keys in (
                          reaction_order, reaction_order + ["within"]
                      ), (path, keys)
                  # A program picks its own backends; what CI pins is that the
                  # bytecode spawns the one its source asked for. Instantiating
                  # qualifies an agent by its instance path, so the declaration
                  # is found under the last segment.
                  if instruction["op"] == "spawn_agent":
                      local = instruction["name"].rsplit(".", 1)[-1]
                      assert local in declared, (path, instruction)
                      assert instruction["backend"] in declared[local], (
                          path, instruction, sorted(declared[local])
                      )
          PY

  popup-quote-integration:
    name: Popup Quote Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmux and zsh
        run: .github/scripts/install-packages.sh tmux zsh

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build omar
        run: cargo build --bin omar

      - name: Run popup quote regression
        run: bash tests/ci/tmux_popup_quote.sh

  unresolved-session-integration:
    name: Unresolved Session Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: .github/scripts/install-packages.sh tmux

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build omar
        run: cargo build --bin omar

      - name: Run unresolved session integration
        run: bash tests/ci/tmux_unresolved_session.sh

  codex-yolo-integration:
    name: Codex YOLO Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: .github/scripts/install-packages.sh tmux

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build omar
        run: cargo build --bin omar

      - name: Run codex YOLO integration
        run: bash tests/ci/tmux_codex_fallback.sh

  ea-zero-selector-integration:
    name: EA Zero Selector Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: .github/scripts/install-packages.sh tmux

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build omar
        run: cargo build --bin omar

      - name: Run EA zero-selector integration
        run: bash tests/ci/tmux_ea_selector_zero.sh

  dashboard-relaunch-handoff-integration:
    name: Dashboard Relaunch Handoff Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: .github/scripts/install-packages.sh tmux

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build omar
        run: cargo build --bin omar

      - name: Run dashboard relaunch handoff integration
        run: bash tests/ci/dashboard_relaunch_handoff.sh

  opencode-compat:
    name: Opencode Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install tmux
        run: .github/scripts/install-packages.sh tmux

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run backend config unit tests
        run: cargo test --bin omar config::tests -- --test-threads=1

      - name: Run custom command integration test
        run: cargo test --test integration_test test_spawn_custom_command -- --test-threads=1

      - name: Verify no hardcoded claude references in runtime paths
        run: |
          # Ensure no hardcoded "claude --dangerously-skip-permissions" remains
          # outside of config.rs (where it's the fallback default)
          MATCHES=$(grep -rn '"claude --dangerously-skip-permissions"' src/ --include='*.rs' | grep -v 'src/config.rs' || true)
          if [ -n "$MATCHES" ]; then
            echo "Found hardcoded claude command outside config.rs:"
            echo "$MATCHES"
            exit 1
          fi
          echo "No hardcoded claude references found outside config.rs"

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: omar-${{ matrix.os }}
          path: |
            target/release/omar
            target/release/omar-computer
            target/release/omar-slack

  # Ensure all jobs pass before allowing merge
  ci-success:
    name: CI Success
    needs: [check, fmt, clippy, test, omar-language, popup-quote-integration, unresolved-session-integration, codex-yolo-integration, ea-zero-selector-integration, dashboard-relaunch-handoff-integration, opencode-compat, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]] || \
             [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.omar-language.result }}" != "success" ]] || \
             [[ "${{ needs.popup-quote-integration.result }}" != "success" ]] || \
             [[ "${{ needs.unresolved-session-integration.result }}" != "success" ]] || \
             [[ "${{ needs.codex-yolo-integration.result }}" != "success" ]] || \
             [[ "${{ needs.ea-zero-selector-integration.result }}" != "success" ]] || \
             [[ "${{ needs.dashboard-relaunch-handoff-integration.result }}" != "success" ]] || \
             [[ "${{ needs.opencode-compat.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed!"
