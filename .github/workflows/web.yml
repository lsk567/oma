name: Web

# Mission Control lives in `web/`. Its jobs are a separate workflow so the
# client's toolchain is declared in one place rather than threaded through the
# runtime's. Both workflows run on every pull request: no path filter, because a
# skipped job never reports and a required check that never reports blocks the
# pull request forever.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  test:
    name: Web Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  # The client and the runtime used to live in separate repositories, so this
  # could only run on a schedule against whatever `main` happened to be. They
  # are now built from one commit, so it runs on the pull request that changes
  # either of them — which is the drift it exists to catch.
  conformance:
    name: Web Conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lang
          build: true
          test: false
      - name: Build the runtime
        run: cargo build --bin omar
        working-directory: .
      # Topology agents run in tmux panes, so a real run needs one.
      - run: .github/scripts/install-packages.sh tmux
        working-directory: .
      - run: npm ci
      # Probes the runtime for the features it needs and skips what is missing,
      # so a client change that lands before the runtime one still passes.
      - name: Compare the fake against the real daemon
        run: npm run test:conformance

  # `make dev` starts two servers and has to point them at each other and stop
  # them together. Nothing else in either suite exercises that, and every bug it
  # has had looked fine until something ran it.
  dev-script:
    name: Web Dev Script
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # `omar serve` launches the assistant in a tmux pane.
      - run: .github/scripts/install-packages.sh tmux
        working-directory: .
      - run: npm ci
      - name: Start both, check both, stop both
        run: ./tests/dev-script.test.sh

  # The daemon serving Mission Control itself. Nothing else here loads a page
  # from the runtime: the browser suite drives a fake on another origin, and the
  # Rust tests never open one.
  serve-ui:
    name: Web Serve UI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build:spa
      # The bundle has to exist before this: the feature embeds it.
      - name: Build the runtime with the UI in it
        run: cargo build --bin omar --features ui
        working-directory: .
      # `--with-deps` shells out to apt for the browser's shared libraries, and
      # that apt is the one that has hung this job to its ceiling twice. It
      # takes no flags from us, so the bound goes on the runner.
      - name: Bound apt's wait for the dpkg lock
        run: .github/scripts/bound-apt.sh
        working-directory: .
      # The browser is ~150MB from a CDN and changes only when Playwright does.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:serve-ui

  e2e:
    name: Web E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `--with-deps` shells out to apt for the browser's shared libraries, and
      # that apt is the one that has hung this job to its ceiling twice. It
      # takes no flags from us, so the bound goes on the runner.
      - name: Bound apt's wait for the dpkg lock
        run: .github/scripts/bound-apt.sh
        working-directory: .
      # The browser is ~150MB from a CDN and changes only when Playwright does.
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Drives prompt -> design -> confirm -> spawn -> finished against a fake
      # `omar serve`. No model, no Lean toolchain, no tmux.
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7
